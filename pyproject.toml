[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-resolver"
version = "0.1.0"
description = "Rollenbasierte Quellenaufloesung fuer Skills -- Stufenleiter von Nutzerkonfiguration bis Fremdanbieter, mit Nutzervorrang und Discovery-Bestaetigung."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lukas Geiger" }]
keywords = ["skills", "source-resolution", "policy", "decisions", "user-model", "ellmos"]

[project.scripts]
source-resolver = "source_resolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
